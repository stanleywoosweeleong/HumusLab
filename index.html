p{margin:0}

main{max-width:42rem;margin:0 auto;padding:1rem 16px;display:flex;flex-direction:column;gap:1rem}
section{display:none;flex-direction:column;gap:1rem}
section.on{display:flex}
.card{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:.9rem;display:flex;flex-direction:column;gap:.7rem}

.lab{font-weight:800;color:var(--humus)}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:.25rem}

.arrow{text-align:center;font-weight:800;color:var(--soil);line-height:1}
.split{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
@media(max-width:400px){.split{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;border:2px solid currentColor;border-radius:4px;padding:.1rem .45rem;font-size:.9rem;white-space:nowrap}
.badge i{display:inline-block;width:.55rem;height:.9rem;background:currentColor;opacity:.22}
.badge i.f{opacity:1}
.b-strong{color:var(--strong)} .b-mixed{color:var(--mixed)} .b-weak{color:var(--weak)}
details{background:var(--card);border:2px solid var(--line);border-radius:6px}
details>summary{list-style:none;padding:.75rem .9rem;font-weight:800;cursor:pointer;display:flex;flex-direction:column;gap:.35rem}
details>summary::-webkit-details-marker{display:none}
details>summary .row{display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between}
details>summary .row::after{content:"+";font-size:1.4rem;line-height:1;color:var(--soil)}
details[open]>summary .row::after{content:"–"}
details .in{padding:0 .9rem .9rem;display:flex;flex-direction:column;gap:.6rem}
.src{font-size:.92rem;color:var(--soil);font-weight:700}
.stripe{border-left:8px solid var(--line)}

.jar{background:var(--card);border:2px solid var(--soil);border-radius:4px;padding:.4rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-weight:800;text-align:center}

.cmp>*{padding:.4rem .5rem;border-top:2px solid var(--line)}

.loss svg{flex:0 0 2.6rem;width:2.6rem;height:2.6rem}
ol.steps{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.35rem}
.tl{display:grid;grid-template-columns:auto 1fr;gap:.45rem .7rem;align-items:start}
.tl b{background:var(--tint);border:2px solid var(--soil);border-radius:4px;padding:.15rem .45rem;white-space:nowrap}

.q:last-child{border-bottom:0;padding-bottom:0}
.q .hd{display:flex;gap:.6rem;align-items:center}
.q .hd svg{flex:0 0 2.4rem;width:2.4rem;height:2.4rem}

.meter{height:1.2rem;border:2px solid var(--soil);border-radius:3px;background:var(--tint)}
.meter span{display:block;height:100%;background:var(--soil)}
ul{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}

#pick h1{font-size:1.8rem;font-weight:800}
#pick p{font-size:1.05rem;max-width:22rem}
#pick .btns{display:flex;flex-direction:column;gap:.7rem;width:100%;max-width:16rem}

ol.refs{margin:0;padding-left:1.5rem;display:flex;flex-direction:column;gap:.6rem}

.wa{display:inline-block;background:var(--leaf);color:#fff;text-decoration:none;border-radius:4px;padding:.6rem 1rem;font-weight:800}
.toast{position:fixed;left:0;right:0;bottom:4.6rem;z-index:15;margin:0 auto;max-width:40rem;background:var(--card);border:3px solid var(--leaf);border-radius:6px;padding:.6rem .8rem;display:flex;align-items:center;gap:.6rem;font-weight:800}

 const flowToday='<div class="flow">'

 const flowLecture='<div class="flow">'
  +'<div class="box">'+IC.leaf+'<div><b>'+T({zh:"动植物残体",en:"Plant and animal residues",bm:"Sisa tumbuhan dan haiwan"})+'</b></div></div>'

  +'</div>';
 const todayTxt=T({
  zh:"<p>2015 年《Nature》的一篇论文指出，现有证据并不支持土壤里会合成出巨大而稳定的“腐植物质”分子。土壤有机质更像一条连续带：各种正在逐步分解的有机物。它能留多久，主要看微生物够不够得着，以及粘粒矿物有没有把它保护起来。</p><p>后来的测定发现，死去的微生物残体可以占土壤有机碳的一半以上。所以养土其实是在养微生物。</p><p>另一派科学家回应说，用碱提取出来的腐植酸、黄腐酸仍然是有用的研究工具，在农药吸附、金属结合、堆肥腐熟度等问题上解决过实际问题。两种看法目前并存。</p>",
  en:"<p>A 2015 paper in Nature argued that the evidence does not support large, stable “humic substance” molecules forming in soil. Soil organic matter looks more like a continuum of compounds at different stages of decomposition. How long it lasts depends mainly on whether microbes can reach it and whether clay minerals protect it.</p><p>Later measurements found that dead microbial remains can make up more than half of soil organic carbon. Feeding the soil really means feeding its microbes.</p><p>Other scientists replied that humic and fulvic acids extracted with alkali remain useful research tools, and have solved practical problems in pesticide binding, metal binding and compost maturity. Both views are in use today.</p>",
  bm:"<p>Satu kertas dalam Nature pada 2015 berhujah bahawa bukti tidak menyokong pembentukan molekul “bahan humik” yang besar dan stabil dalam tanah. Bahan organik tanah lebih mirip satu rangkaian sebatian pada pelbagai peringkat pereputan. Tempoh ia bertahan bergantung terutamanya pada sama ada mikrob dapat mencapainya dan sama ada mineral liat melindunginya.</p><p>Pengukuran kemudian mendapati sisa mikrob yang mati boleh membentuk lebih separuh karbon organik tanah. Memberi makan tanah sebenarnya memberi makan mikrobnya.</p><p>Saintis lain menjawab bahawa asid humik dan fulvik yang diekstrak dengan alkali masih alat kajian yang berguna, dan telah menyelesaikan masalah sebenar dalam pengikatan racun perosak, pengikatan logam dan kematangan kompos. Kedua-dua pandangan digunakan hari ini.</p>"});
 const lecTxt=T({
  zh:"<p>课堂笔记的说法是经典模型：残体先变成非腐植物质，再经微生物作用聚合成高分子量的腐植物质。两类物质在所有土壤里同时存在，前者不断转化为后者。</p><p>这个模型解释了许多现象，但“聚合成大分子”这一步，如今受到质疑。上面的图是今天的看法。</p>",
  en:"<p>The lecture notes give the classical model: residues first become non-humic substances, then microbes help polymerise them into high-molecular-weight humic substances. Both kinds are present in every soil, and the first keeps changing into the second.</p><p>The model explains a lot, but the step where small molecules join into giant ones is now questioned. The picture above shows today's view.</p>",
  bm:"<p>Nota kuliah memberi model klasik: sisa mula-mula menjadi bahan bukan humik, kemudian mikrob membantu mempolimerkannya menjadi bahan humik berjisim molekul tinggi. Kedua-duanya ada dalam setiap tanah, dan yang pertama sentiasa berubah menjadi yang kedua.</p><p>Model ini menerangkan banyak perkara, tetapi langkah molekul kecil bercantum menjadi molekul gergasi kini dipersoalkan. Gambar di atas menunjukkan pandangan hari ini.</p>"});
 const ae=T({
  zh:"<p><b>通气良好：</b>纤维素、半纤维素、蛋白质很快被分解成糖和氨基酸，再被氧化成 CO₂、水、铵、磷酸盐和硫酸盐，也就是植物能用的养分。剩下的主要是半分解的木质素和微生物细胞。</p>",
  en:"<p><b>With air:</b> cellulose, hemicellulose and protein are quickly broken into sugars and amino acids, then oxidised to CO₂, water, ammonium, phosphate and sulphate, which plants can use. What remains is mostly partly decomposed lignin and microbial cells.</p>",
  bm:"<p><b>Dengan udara:</b> selulosa, hemiselulosa dan protein cepat dipecah menjadi gula dan asid amino, kemudian dioksidakan menjadi CO₂, air, ammonium, fosfat dan sulfat yang boleh digunakan tumbuhan. Yang tinggal kebanyakannya lignin separa reput dan sel mikrob.</p>"});
 const an=T({
  zh:"<p><b>积水缺氧：</b>氧化被阻断，上面那些简单养分形不成，CO₂ 也少得多。残体里的纤维素、木质素和蛋白质大多原样留着。</p><p>对果园的意思：积水的土，有机质堆着却放不出养分。先解决排水，再谈加有机质。</p>",
  en:"<p><b>Waterlogged, no air:</b> oxidation stops, those simple nutrients do not form, and far less CO₂ is released. Much of the cellulose, lignin and protein stays as it was.</p><p>For an orchard: in waterlogged soil, organic matter sits there without releasing nutrients. Fix drainage before adding more.</p>",
  bm:"<p><b>Bertakung, tiada udara:</b> pengoksidaan terhenti, nutrien ringkas itu tidak terbentuk, dan CO₂ jauh lebih sedikit. Banyak selulosa, lignin dan protein kekal seperti asal.</p><p>Untuk dusun: dalam tanah bertakung, bahan organik tersimpan tanpa membebaskan nutrien. Baiki saliran dahulu sebelum menambah lagi.</p>"});

function hometests(){
 return '<div class="card"><h3>'+T({zh:"怎样判断一个产品",en:"Judging a product",bm:"Menilai sesuatu produk"})+'</h3>'
 +'<p>'+T({zh:"实验室测腐植酸和黄腐酸，用的是经过验证的标准方法：先用碱液提取，再加酸把腐植酸沉淀出来分别测定。在家里做不到这一步，所以没有一种家庭小试验能量出含量。",en:"Laboratories measure humic and fulvic acid with a validated standard method: extract with alkali, then add acid so the humic acid settles out and each part can be measured. That cannot be done at home, so no home test measures content.",bm:"Makmal mengukur asid humik dan fulvik dengan kaedah piawai yang disahkan: ekstrak dengan alkali, kemudian tambah asid supaya asid humik mendap dan setiap bahagian boleh diukur. Ini tidak boleh dibuat di rumah, jadi tiada ujian rumah yang mengukur kandungan."})+'</p>'+src(["LM"])
 +'<p class="lab">'+T({zh:"可以做的三件事",en:"Three things you can do",bm:"Tiga perkara yang boleh dibuat"})+'</p><ul>'
 +'<li>'+T({zh:"看标签上的含量是用什么方法测的；方法不同，数字不能比。",en:"Check which test method is behind the percentage on the label. Different methods give numbers that cannot be compared.",bm:"Semak kaedah ujian di sebalik peratusan pada label. Kaedah berbeza memberi angka yang tidak boleh dibandingkan."})+'</li>'
 +'<li>'+T({zh:"对一对标签上的“水溶性”。腐植酸钾的规格表通常写明水溶性百分比，例如 NTS 的可溶腐植酸颗粒标明溶解度 85%，并说明有 10% 到 15% 不溶。一勺产品放进一杯清水搅匀静置，如果杯底的渣明显比标签说的多，就和规格不符。这只能核对水溶性，不能说明腐植酸含量。",en:"Compare against the water solubility on the label. Potassium humate specification sheets normally state a water-solubility percentage. For example, NTS Soluble Humate Granules lists solubility of 85% and notes that 10 to 15% is insoluble. Stir a spoonful into a glass of clear water and let it stand. Clearly more sediment than the label implies means it does not match its specification. This checks solubility only, not humic acid content.",bm:"Bandingkan dengan keterlarutan air pada label. Helaian spesifikasi kalium humat biasanya menyatakan peratusan keterlarutan air. Contohnya, NTS Soluble Humate Granules menyenaraikan keterlarutan 85% dan menyatakan 10 hingga 15% tidak larut. Kacau sesudu ke dalam segelas air jernih dan biarkan. Mendapan yang jelas lebih banyak daripada yang dinyatakan label bermakna ia tidak menepati spesifikasinya. Ini hanya menyemak keterlarutan, bukan kandungan asid humik."})+'</li>'
 +'<li>'+T({zh:"留几棵树不施、绑上布条，下次抽梢时比一眼。只有这个能告诉你它在你的园里有没有用。",en:"Leave a few trees untreated with a ribbon and compare once at the next flush. Only this tells you whether it works in your orchard.",bm:"Biarkan beberapa pokok tanpa rawatan dengan reben dan bandingkan sekali pada pucuk baharu seterusnya. Hanya ini yang memberitahu sama ada ia berkesan di dusun anda."})+'</li></ul>'+src(["NS"])
 +'<p>'+T({zh:"目前的商品腐植物质大多来自煤和泥炭（例如风化褐煤），属于不可再生资源；堆肥和蚯蚓粪是可再生的来源。",en:"Most commercial humic material today comes from coal and peat, such as leonardite, which are non-renewable. Compost and vermicompost are renewable sources.",bm:"Kebanyakan bahan humik komersial hari ini berasal daripada arang batu dan gambut, seperti leonardit, yang tidak boleh diperbaharui. Kompos dan vermikompos ialah sumber boleh diperbaharui."})+'</p>'+src(["C15"])+'</div>';
}

 +'<div class="cmp"><span class="h hh"></span><span class="h hf">'+T(FRAC.fa.n)+'</span><span class="h hh">'+T(FRAC.ha.n)+'</span>'

 +'<li>'+T({zh:"按标签用量。下面的葡萄试验里，浓度加到四倍，好处反而没了。",en:"Keep to the label rate. In the grape trial below, four times the concentration lost the benefit.",bm:"Ikut kadar label. Dalam ujian anggur di bawah, kepekatan empat kali ganda menghilangkan manfaat."})+'</li>'
 +'<li>'+T({zh:"我没有找到黄腐酸在榴莲上的试验。想用就自己验证：留几棵不施并绑布条，下次抽梢时比一眼。",en:"I found no fulvic acid trial on durian. If you want to use it, check it yourself: leave a few trees untreated with a ribbon and compare once at the next flush.",bm:"Saya tidak menemui ujian asid fulvik pada durian. Jika mahu menggunakannya, uji sendiri: biarkan beberapa pokok tanpa rawatan dengan reben dan bandingkan sekali pada pucuk baharu seterusnya."})+'</li></ul>'
 +FAX.map(x=>'<details class="stripe s-'+x.e+'"><summary><span class="row"><span>'+esc(T(x.t))+'</span></span>'+badge(x.e)+'</summary><div class="in"><p>'+esc(T(x.b))+'</p>'+src(x.r)+'</div></details>').join("")
 +'<p>'+T({zh:"一篇“从实验室到田间”的综述指出，效果取决于腐植物质的化学结构、施用方式、用量和田间条件。",en:"A review titled From lab to field points out that the result depends on the chemical structure of the humic material, how it is applied, the rate, and field conditions.",bm:"Satu ulasan bertajuk From lab to field menyatakan bahawa keputusan bergantung pada struktur kimia bahan humik, cara penggunaan, kadar dan keadaan ladang."})+'</p>'+src(["JI"])+'</div>';
}

function moreBuild(){

 +T({zh:"<p>疫霉病是榴莲最严重的病害。澳大利亚国际农业研究中心（ACIAR）的榴莲综合防治建议里，果园建成之后的管理重点之一，就是用有机覆盖物改善和保持土壤健康，提高土壤有机质和微生物活性。</p><p>道理是：有机物料让土壤里的微生物活跃起来，它们会压制疫霉菌的存活和活动。但物料的性质不同，效果也不同，所以要用腐熟的堆肥和园里的落叶、草屑，覆盖物离开树干，并先把排水做好。</p><p>它是预防的一部分，不能代替对病树的处理。树干已经出现病斑，请看《榴莲树干病辨症》软件。</p>",
     en:"<p>Phytophthora is the most serious disease of durian. In the integrated management recommendations from the Australian Centre for International Agricultural Research (ACIAR), one priority after an orchard is established is to improve and maintain soil health with organic mulches, building up soil organic matter and microbial activity.</p><p>The reason: organic material makes soil microbes active, and they suppress the survival and activity of Phytophthora. The effect depends on the nature of the material, so use mature compost and the orchard's own leaves and cut grass, keep mulch off the trunk, and get drainage right first.</p><p>This is part of prevention. It does not replace treating a diseased tree. If the trunk already shows lesions, see the Durian Trunk Disease Triage app.</p>",
     bm:"<p>Phytophthora ialah penyakit durian yang paling serius. Dalam saranan pengurusan bersepadu daripada Australian Centre for International Agricultural Research (ACIAR), satu keutamaan selepas dusun ditubuhkan ialah memperbaiki dan mengekalkan kesihatan tanah dengan sungkupan organik, membina bahan organik tanah dan aktiviti mikrob.</p><p>Sebabnya: bahan organik mengaktifkan mikrob tanah, dan mereka menekan kemandirian serta aktiviti Phytophthora. Kesannya bergantung pada sifat bahan, jadi guna kompos matang serta daun dan rumput potong dusun sendiri, jauhkan sungkupan daripada batang, dan betulkan saliran dahulu.</p><p>Ini sebahagian daripada pencegahan. Ia tidak menggantikan rawatan pokok yang berpenyakit. Jika batang sudah menunjukkan lesi, lihat aplikasi Durian Trunk Disease Triage.</p>"})
 +src(["AC","IS"])+'</div>'
 +'<div class="card"><h3>'+T({zh:"榴莲园里的试验结果",en:"What a durian orchard trial found",bm:"Apa yang ditemui ujian dusun durian"})+'</h3>'

   bm:"Penanam durian, sila ambil perhatian: ini bukan untuk durian. Durian memerlukan tempoh kering dan permukaan tanah yang panas untuk mencetuskan pembungaan, dan penutup yang lebat seperti Mucuna bracteata mengekalkan tanah teduh dan lembap, jadi pokok tidak berbunga. Selebihnya untuk penanam kelapa sawit atau tanaman lain. Penutup hidup menghasilkan bahan organik sendiri, tanpa perlu diangkut. Dalam kajian kelapa sawit di Malaysia, plot dengan Mucuna bracteata mempunyai bahan organik tanah, jumlah nitrogen, kapasiti pertukaran kation dan fosforus tersedia yang jauh lebih tinggi. Kajian pokok buah tropika juga menyatakan penutup bumi kekal mengurangkan hakisan dan kehilangan bahan organik serta memperbaiki struktur tanah, tetapi tanaman penutup bersaing dengan pokok untuk nutrien dan air. Keputusan ini daripada kelapa sawit dan pokok buah lain, bukan durian. Tumbuhan menjalar ini tumbuh subur, jadi cantas selalu dan jauhkan daripada batang dan kanopi."},["MB","LE"])

 const coreDone=CORE.filter(k=>ans[k]!==undefined).length;
 if(coreDone<CORE.length)return '<div class="result"><h3>'+T({zh:"已完成 ",en:"Answered ",bm:"Dijawab "})+coreDone+' / '+CORE.length+'</h3><div class="meter"><span style="width:'+(coreDone/CORE.length*100)+'%"></span></div><p>'+T({zh:"上面三项都选好，这里就给出结果和该做的事。",en:"Answer the three above to see the result and what to do.",bm:"Jawab tiga di atas untuk melihat keputusan dan apa yang perlu dibuat."})+'</p></div>';
 const sc=done.reduce((s,q)=>s+Number(ans[q.id]),0), mx=done.length*2, pc=sc/mx;
 const lv=pc>=0.75?"strong":pc>=0.4?"mixed":"weak";
 const head={strong:{zh:"有机质状况良好",en:"Organic matter looks good",bm:"Bahan organik kelihatan baik"},mixed:{zh:"有机质中等，要补",en:"Organic matter is moderate and needs topping up",bm:"Bahan organik sederhana dan perlu ditambah"},weak:{zh:"有机质偏低，现在就动手",en:"Organic matter is low, act now",bm:"Bahan organik rendah, bertindak sekarang"}}[lv];
 const base={
  strong:{zh:"保持现在的做法：落叶和草屑留在树冠下，每年补一次腐熟堆肥。",en:"Keep doing what you do: leave litter and cut grass under the canopy and top up with mature compost once a year.",bm:"Teruskan amalan sekarang: biarkan daun gugur dan rumput potong di bawah kanopi dan tambah kompos matang setahun sekali."},
  mixed:{zh:"这个月开始：树冠下铺满覆盖物（落叶、草屑、碎枝），离树干留出空隙。雨季初施腐熟堆肥。",en:"Starting this month: cover the ground under the canopy with mulch (leaf litter, cut grass, chipped prunings), leaving a gap around the trunk. Apply mature compost at the start of the rains.",bm:"Bermula bulan ini: liputi tanah di bawah kanopi dengan sungkupan (daun gugur, rumput potong, ranting cincang), tinggalkan ruang di sekeliling batang. Tabur kompos matang pada awal musim hujan."},
  weak:{zh:"这个月开始：树冠下铺满覆盖物（落叶、草屑、碎枝），离树干留出空隙；停止把地面清得光秃秃。雨季初施腐熟堆肥，之后每季补覆盖物。",en:"Starting this month: cover the ground under the canopy with mulch (leaf litter, cut grass, chipped prunings), leaving a gap around the trunk, and stop clearing the ground bare. Apply mature compost at the start of the rains, then top up the mulch every season.",bm:"Bermula bulan ini: liputi tanah di bawah kanopi dengan sungkupan (daun gugur, rumput potong, ranting cincang), tinggalkan ruang di sekeliling batang, dan berhenti membersihkan tanah sehingga gondol. Tabur kompos matang pada awal musim hujan, kemudian tambah sungkupan setiap musim."}}[lv];
 const weakest=done.filter(q=>Number(ans[q.id])===0);
 return '<div class="result r-'+lv+'">'+badge(lv).replace(esc(T(S.ev[lv])),sc+' / '+mx)+'<h3>'+esc(T(head))+'</h3><div class="meter"><span style="width:'+(pc*100)+'%"></span></div><p>'+esc(T(base))+'</p>'
  +(weakest.length?'<ul>'+weakest.map(q=>'<li>'+esc(T(q.tip))+'</li>').join("")+'</ul>':'')
  +'<p>'+T({zh:"这是按看得见的迹象做的简易判断，不是化验值。",en:"This is a simple judgement from visible signs. It is not a laboratory value.",bm:"Ini penilaian ringkas daripada tanda yang nampak. Ia bukan nilai makmal."})+'</p>'+src(["VS","US"])+'</div>';
}
const qrow=q=>'<div class="q"><div class="hd">'+QI[q.id]+'<span class="lab">'+esc(T(q.q))+'</span></div>'+(T(q.h)?'<p>'+esc(T(q.h))+'</p>':'')+'<div class="chips">'+q.o.map((o,i)=>chip("ans."+q.id,i,T(o),String(ans[q.id])===String(i))).join("")+'</div></div>';
function check(){
 $("v-check").innerHTML=
 '<h2>'+T({zh:"不用化验，检查土壤有机质",en:"Check soil organic matter without a lab",bm:"Semak bahan organik tanah tanpa makmal"})+'</h2>'
 +'<p class="lead">'+T({zh:"走到树冠下看三样东西，两分钟，不用工具。",en:"Walk under the canopy and look at three things. Two minutes, no tools.",bm:"Berjalan di bawah kanopi dan lihat tiga perkara. Dua minit, tanpa alat."})+'</p>'
 +'<div class="card">'+CORE.map(k=>qrow(QS.find(q=>q.id===k))).join("")+'</div>'
 +'<details'+(QS.some(q=>!CORE.includes(q.id)&&ans[q.id]!==undefined)?' open':'')+'><summary><span class="row"><span>'+T({zh:"有空再多看三项（要挖土）",en:"Three more if you have time (needs digging)",bm:"Tiga lagi jika ada masa (perlu menggali)"})+'</span></span></summary><div class="in">'+QS.filter(q=>!CORE.includes(q.id)).map(qrow).join("")+'</div></details>'
 +'<div id="chk-out">'+checkResult()+'</div>';
}

/* ================= SOURCES ================= */
function sources(){
 return '<details><summary><span class="row"><span>'+T({zh:"资料来源",en:"Sources",bm:"Rujukan"})+'</span></span></summary><div class="in"><p>'+T({zh:"前三项是借来的课堂笔记，其余是用来核对和补充的研究与机构指南。",en:"The first three are the borrowed lecture notes. The rest are the studies and institutional guides used to check and extend them.",bm:"Tiga yang pertama ialah nota kuliah yang dipinjam. Selebihnya ialah kajian dan panduan institusi yang digunakan untuk menyemak dan melanjutkannya."})+'</p>'
 +'<ol class="refs">'+REFORDER.map(k=>{const r=REF[k];return '<li>'+(r.s?esc(T(r.s)):esc(r.c)+' <a href="'+r.u+'" target="_blank" rel="noopener">'+T({zh:"打开",en:"Open",bm:"Buka"})+'</a>')+'</li>'}).join("")+'</ol></div></details>'
 +'<div class="card qr"><h3>'+T({zh:"分享这个软件",en:"Share this app",bm:"Kongsi aplikasi ini"})+'</h3>'+QR+'<span class="url">'+URL_APP+'</span><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(T({zh:"沃土有机质 HumusLab：土壤有机质与腐植酸 ",en:"HumusLab: soil organic matter and humic substances ",bm:"HumusLab: bahan organik tanah dan asid humik "})+URL_APP)+'">WhatsApp</a></div>'
 +'<details><summary><span class="row"><span>'+T({zh:"三档证据是怎么分的",en:"How the three evidence grades were set",bm:"Bagaimana tiga gred bukti ditetapkan"})+'</span></span></summary><div class="in"><p>'
 +T({zh:"证据充分：有荟萃分析、机构指南或多项独立研究支持，或机理已在实验中直接观察到。视情况而定：实验室里成立，但田间结果不一致，或作用大小因土质、作物、用量而变。证据有限：只见于课堂笔记或产品资料，或只有个别试验。榴莲上的直接研究很少，凡是从其他作物推过来的地方都已注明。",
     en:"Well supported: backed by a meta-analysis, an institutional guide or several independent studies, or the mechanism was observed directly in experiments. Depends on conditions: holds in the laboratory but field results are inconsistent, or the size of the effect changes with soil, crop and rate. Limited evidence: found only in the lecture notes or product material, or in a single trial. Direct research on durian is scarce, and every place where results come from other crops says so.",
     bm:"Bukti kukuh: disokong oleh meta-analisis, panduan institusi atau beberapa kajian bebas, atau mekanismenya diperhatikan terus dalam eksperimen. Bergantung keadaan: benar di makmal tetapi keputusan ladang tidak konsisten, atau saiz kesan berubah mengikut tanah, tanaman dan kadar. Bukti terhad: hanya ditemui dalam nota kuliah atau bahan produk, atau dalam satu ujian sahaja. Kajian langsung tentang durian amat sedikit, dan setiap tempat yang keputusannya datang daripada tanaman lain telah dinyatakan."})
 +'</p></div></details>';
}

/* ================= shell ================= */
const VIEWS={basics,humic,build,check};
let tab="basics";
function route(){const h=location.hash.replace("#","");tab=VIEWS[h]?h:"basics";paint()}
function paint(){
 document.documentElement.lang=lang==="bm"?"ms":lang;
 $("ttl").textContent=T(S.title);
 $("lg").textContent=LABEL[lang];
 $("toastmsg").textContent=T({zh:"新版本已准备好",en:"A new version is ready",bm:"Versi baharu sudah sedia"});
 $("toastgo").textContent=T({zh:"刷新",en:"Refresh",bm:"Muat semula"});
 $("nav").innerHTML=S.tabs.map(t=>'<button type="button" data-tab="'+t.id+'"'+(t.id===tab?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t.i+'</svg><span>'+esc(T(t.n))+'</span></button>').join("");
 for(const k in VIEWS){$("v-"+k).classList.toggle("on",k===tab)}
 VIEWS[tab]();
}
document.addEventListener("click",ev=>{
 const nb=ev.target.closest("nav button");
 if(nb){tab=nb.dataset.tab;try{location.hash=tab}catch(e){}paint();window.scrollTo(0,0);return}
 const b=ev.target.closest("[data-g]");
 if(!b)return;
 const g=b.dataset.g,v=b.dataset.v;
 if(g==="view"){view=v;store.set("view",v)}
 else if(g==="air"){air=v;store.set("air",v)}
 else if(g==="fg"){fg=v}
 else if(g==="fr"){fr=v}
 else if(g==="dose"){dose=v}
 else if(g==="mat"){mat=v}
 else if(g.startsWith("cq.")){cq[g.slice(3)]=Number(v)}
 else if(g==="pace"){pace=v}
 else if(g==="yrs"){yrs=v;store.set("yrs",v)}
 else if(g==="depth"){depth=v;store.set("depth",v)}
 else if(g.startsWith("dq.")){const k=g.slice(3);dq[k]=v;store.set(g,v)}
 else if(g.startsWith("ans.")){ans[g.slice(4)]=Number(v);store.set("ans",JSON.stringify(ans))}
 const y=window.scrollY;VIEWS[tab]();window.scrollTo(0,y);
});
document.addEventListener("input",ev=>{
 if(ev.target.id==="area"){area=ev.target.value;store.set("area",area);$("calc-out").innerHTML=calcResult()}
});
$("lg").addEventListener("click",()=>{lang=ORDER[(ORDER.indexOf(lang)+1)%3];store.set("lang",lang);paint()});
let size=Number(store.get("size"))||0;
const applySize=()=>{document.documentElement.dataset.size=String(size)};
$("aa").addEventListener("click",()=>{size=(size+1)%3;store.set("size",String(size));applySize()});
applySize();
$("pick").addEventListener("click",ev=>{const b=ev.target.closest("button[data-l]");if(!b)return;lang=b.dataset.l;store.set("lang",lang);$("pick").classList.remove("on");paint()});
window.addEventListener("hashchange",route);
$("toastgo").addEventListener("click",()=>location.reload());
$("toastx").addEventListener("click",()=>{$("toast").hidden=true});
try{
 if("serviceWorker" in navigator && (/github\.io$/.test(location.hostname)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  const ask=()=>{if(navigator.onLine===false)return;navigator.serviceWorker.ready.then(r=>{if(r.active)r.active.postMessage("check")}).catch(()=>{})};
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data==="updated")$("toast").hidden=false});
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").then(ask).catch(()=>{})});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")ask()});
 }
}catch(e){}
if(!ORDER.includes(lang)){lang="zh";$("pick").classList.add("on")}
route();
</script>
</body>
</html>
