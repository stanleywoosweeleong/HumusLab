html{font-size:var(--fs)}

h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
h2{font-size:1.3rem;font-weight:800;color:var(--humus)}
h3{font-size:1.08rem;font-weight:800}
p{margin:0}
a{color:var(--leaf);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--humus);color:#fff;display:flex;align-items:center;gap:.5rem;padding:.55rem 16px}
header h1{font-size:1.1rem;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:#fff;color:var(--humus);border:0;border-radius:4px;font-weight:800;min-width:2.9rem;height:2.4rem;padding:0 .5rem}
main{max-width:42rem;margin:0 auto;padding:1rem 16px;display:flex;flex-direction:column;gap:1rem}
section{display:none;flex-direction:column;gap:1rem}
section.on{display:flex}
.card{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:.9rem;display:flex;flex-direction:column;gap:.7rem}
.lead{font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:var(--card);border:2px solid var(--soil);border-radius:4px;padding:.45rem .7rem;font-weight:700;min-height:2.6rem;text-align:left}
.chip[aria-pressed="true"]{background:var(--soil);color:#fff}
.lab{font-weight:800;color:var(--humus)}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:.25rem}
.box{border:2px solid var(--soil);border-radius:4px;padding:.5rem .65rem;background:var(--tint);display:flex;gap:.6rem;align-items:center}
.box svg{flex:0 0 2.6rem;width:2.6rem;height:2.6rem}
.box b{display:block}
.arrow{text-align:center;font-weight:800;color:var(--soil);line-height:1}
.split{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
@media(max-width:400px){.split{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;border:2px solid currentColor;border-radius:4px;padding:.1rem .45rem;font-size:.9rem;white-space:nowrap}
.badge i{display:inline-block;width:.55rem;height:.9rem;background:currentColor;opacity:.22}
.badge i.f{opacity:1}
.b-strong{color:var(--strong)} .b-mixed{color:var(--mixed)} .b-weak{color:var(--weak)}
details{background:var(--card);border:2px solid var(--line);border-radius:6px}
details>summary{list-style:none;padding:.75rem .9rem;font-weight:800;cursor:pointer;display:flex;flex-direction:column;gap:.35rem}
details>summary::-webkit-details-marker{display:none}
details>summary .row{display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between}
details>summary .row::after{content:"+";font-size:1.4rem;line-height:1;color:var(--soil)}
details[open]>summary .row::after{content:"–"}
details .in{padding:0 .9rem .9rem;display:flex;flex-direction:column;gap:.6rem}
.src{font-size:.92rem;color:var(--soil);font-weight:700}
.stripe{border-left:8px solid var(--line)}
.stripe.s-strong{border-left-color:var(--strong)} .stripe.s-mixed{border-left-color:var(--mixed)} .stripe.s-weak{border-left-color:var(--weak)}
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.jar{background:var(--card);border:2px solid var(--soil);border-radius:4px;padding:.4rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-weight:800;text-align:center}
.jar[aria-pressed="true"]{background:var(--tint);outline:3px solid var(--soil)}
.jar svg{width:100%;max-width:5rem;height:auto}
.bars{display:flex;flex-direction:column;gap:.5rem}
.bar{display:grid;grid-template-columns:1fr;gap:.15rem}
.bar .t{height:1.1rem;background:var(--tint);border:2px solid var(--soil);border-radius:3px}
.bar .t span{display:block;height:100%;background:var(--leaf)}
.q{display:flex;flex-direction:column;gap:.4rem;padding-bottom:.7rem;border-bottom:2px dashed var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.q .hd{display:flex;gap:.6rem;align-items:center}
.q .hd svg{flex:0 0 2.4rem;width:2.4rem;height:2.4rem}
.result{border:3px solid var(--soil);border-radius:6px;padding:.9rem;background:var(--card);display:flex;flex-direction:column;gap:.6rem}
.result.r-strong{border-color:var(--strong)} .result.r-mixed{border-color:var(--mixed)} .result.r-weak{border-color:var(--weak)}
.big{font-size:1.5rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.meter{height:1.2rem;border:2px solid var(--soil);border-radius:3px;background:var(--tint)}
.meter span{display:block;height:100%;background:var(--soil)}
ul{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}

#pick.on{display:flex}

#pick button{background:#fff;color:var(--humus);border:0;border-radius:4px;font-weight:800;font-size:1.25rem;padding:.8rem}
ol.refs{margin:0;padding-left:1.5rem;display:flex;flex-direction:column;gap:.6rem}
ol.refs li{overflow-wrap:anywhere}
.qr{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center}
.qr svg{width:11rem;height:11rem;border:2px solid var(--line);border-radius:4px;background:#fff}
.qr .url{overflow-wrap:anywhere;font-weight:700}
.wa{display:inline-block;background:var(--leaf);color:#fff;text-decoration:none;border-radius:4px;padding:.6rem 1rem;font-weight:800}
.toast{position:fixed;left:0;right:0;bottom:4.6rem;z-index:15;margin:0 auto;max-width:40rem;background:var(--card);border:3px solid var(--leaf);border-radius:6px;padding:.6rem .8rem;display:flex;align-items:center;gap:.6rem;font-weight:800}

/* ================= BASICS ================= */
let view=store.get("view")==="lecture"?"lecture":"today";
let air=store.get("air")==="an"?"an":"ae";
function basics(){
 const flowToday='<div class="flow">'
  +'<div class="box">'+IC.leaf+'<div><b>'+T({zh:"落叶、枯枝、残根、有机肥",en:"Leaf litter, prunings, dead roots, organic inputs",bm:"Daun gugur, ranting, akar mati, input organik"})+'</b></div></div>'
  +'<div class="arrow">▼</div>'
  +'<div class="box">'+IC.bug+'<div><b>'+T({zh:"土壤微生物吃掉并改造",en:"Soil microbes eat and rebuild it",bm:"Mikrob tanah makan dan mengubahnya"})+'</b>'+T({zh:"微生物是工厂，不只是分解者",en:"Microbes are the factory, more than just decomposers",bm:"Mikrob ialah kilang, bukan sekadar pengurai"})+'</div></div>'
  +'<div class="arrow">▼</div>'
  +'<div class="split">'
  +'<div class="box">'+IC.pom+'<div><b>'+T({zh:"颗粒有机质",en:"Particulate organic matter",bm:"Bahan organik zarahan"})+'</b>'+T({zh:"看得见的碎屑，周转快，喂养土壤生物",en:"Visible fragments. Turns over fast and feeds soil life",bm:"Serpihan yang nampak. Cepat bertukar, memberi makan hidupan tanah"})+'</div></div>'
  +'<div class="box">'+IC.maom+'<div><b>'+T({zh:"矿物结合有机质",en:"Mineral-associated organic matter",bm:"Bahan organik terikat mineral"})+'</b>'+T({zh:"细小分子粘在粘粒上，受保护，留得久",en:"Tiny molecules stuck to clay. Protected, so it lasts",bm:"Molekul halus melekat pada liat. Terlindung, jadi tahan lama"})+'</div></div>'
  +'</div>'
  +'<div class="arrow">▲</div>'
  +'<div class="box">'+IC.gas+'<div><b>CO₂</b>'+T({zh:"大部分碳被呼吸掉，回到空气",en:"Most of the carbon is respired back to the air",bm:"Kebanyakan karbon dihembus kembali ke udara"})+'</div></div>'
  +'</div>';
 const flowLecture='<div class="flow">'
  +'<div class="box">'+IC.leaf+'<div><b>'+T({zh:"动植物残体",en:"Plant and animal residues",bm:"Sisa tumbuhan dan haiwan"})+'</b></div></div>'
  +'<div class="arrow">▼</div>'
  +'<div class="box">'+IC.pom+'<div><b>'+T({zh:"非腐植物质",en:"Non-humic substances",bm:"Bahan bukan humik"})+'</b>'+T({zh:"新鲜和半分解的残体，是微生物的食物",en:"Fresh and half-decomposed residues, food for microbes",bm:"Sisa segar dan separa reput, makanan mikrob"})+'</div></div>'
  +'<div class="arrow">▼ '+T({zh:"聚合、缩合",en:"polymerisation, condensation",bm:"pempolimeran, kondensasi"})+'</div>'
  +'<div class="box">'+IC.chain+'<div><b>'+T({zh:"腐植物质",en:"Humic substances",bm:"Bahan humik"})+'</b>'+T({zh:"黄、棕、黑色的大分子：黄腐酸、腐植酸、胡敏素",en:"Large yellow, brown or black molecules: fulvic acid, humic acid, humin",bm:"Molekul besar kuning, perang atau hitam: asid fulvik, asid humik, humin"})+'</div></div>'
  +'</div>';
 const todayTxt=T({
  zh:"<p>2015 年《Nature》的一篇论文指出，现有证据并不支持土壤里会合成出巨大而稳定的“腐植物质”分子。土壤有机质更像一条连续带：各种正在逐步分解的有机物。它能留多久，主要看微生物够不够得着，以及粘粒矿物有没有把它保护起来。</p><p>后来的测定发现，死去的微生物残体可以占土壤有机碳的一半以上。所以养土其实是在养微生物。</p><p>另一派科学家回应说，用碱提取出来的腐植酸、黄腐酸仍然是有用的研究工具，在农药吸附、金属结合、堆肥腐熟度等问题上解决过实际问题。两种看法目前并存。</p>",
  en:"<p>A 2015 paper in Nature argued that the evidence does not support large, stable “humic substance” molecules forming in soil. Soil organic matter looks more like a continuum of compounds at different stages of decomposition. How long it lasts depends mainly on whether microbes can reach it and whether clay minerals protect it.</p><p>Later measurements found that dead microbial remains can make up more than half of soil organic carbon. Feeding the soil really means feeding its microbes.</p><p>Other scientists replied that humic and fulvic acids extracted with alkali remain useful research tools, and have solved practical problems in pesticide binding, metal binding and compost maturity. Both views are in use today.</p>",
  bm:"<p>Satu kertas dalam Nature pada 2015 berhujah bahawa bukti tidak menyokong pembentukan molekul “bahan humik” yang besar dan stabil dalam tanah. Bahan organik tanah lebih mirip satu rangkaian sebatian pada pelbagai peringkat pereputan. Tempoh ia bertahan bergantung terutamanya pada sama ada mikrob dapat mencapainya dan sama ada mineral liat melindunginya.</p><p>Pengukuran kemudian mendapati sisa mikrob yang mati boleh membentuk lebih separuh karbon organik tanah. Memberi makan tanah sebenarnya memberi makan mikrobnya.</p><p>Saintis lain menjawab bahawa asid humik dan fulvik yang diekstrak dengan alkali masih alat kajian yang berguna, dan telah menyelesaikan masalah sebenar dalam pengikatan racun perosak, pengikatan logam dan kematangan kompos. Kedua-dua pandangan digunakan hari ini.</p>"});
 const lecTxt=T({
  zh:"<p>课堂笔记的说法是经典模型：残体先变成非腐植物质，再经微生物作用聚合成高分子量的腐植物质。两类物质在所有土壤里同时存在，前者不断转化为后者。</p><p>这个模型解释了许多现象，但“聚合成大分子”这一步，如今受到质疑。请切换到“今天的看法”对照。</p>",
  en:"<p>The lecture notes give the classical model: residues first become non-humic substances, then microbes help polymerise them into high-molecular-weight humic substances. Both kinds are present in every soil, and the first keeps changing into the second.</p><p>The model explains a lot, but the step where small molecules join into giant ones is now questioned. Switch to “Today's view” to compare.</p>",
  bm:"<p>Nota kuliah memberi model klasik: sisa mula-mula menjadi bahan bukan humik, kemudian mikrob membantu mempolimerkannya menjadi bahan humik berjisim molekul tinggi. Kedua-duanya ada dalam setiap tanah, dan yang pertama sentiasa berubah menjadi yang kedua.</p><p>Model ini menerangkan banyak perkara, tetapi langkah molekul kecil bercantum menjadi molekul gergasi kini dipersoalkan. Tukar ke “Pandangan hari ini” untuk membandingkan.</p>"});
 const ae=T({
  zh:"<p><b>通气良好：</b>纤维素、半纤维素、蛋白质很快被分解成糖和氨基酸，再被氧化成 CO₂、水、铵、磷酸盐和硫酸盐，也就是植物能用的养分。剩下的主要是半分解的木质素和微生物细胞。</p>",
  en:"<p><b>With air:</b> cellulose, hemicellulose and protein are quickly broken into sugars and amino acids, then oxidised to CO₂, water, ammonium, phosphate and sulphate, which plants can use. What remains is mostly partly decomposed lignin and microbial cells.</p>",
  bm:"<p><b>Dengan udara:</b> selulosa, hemiselulosa dan protein cepat dipecah menjadi gula dan asid amino, kemudian dioksidakan menjadi CO₂, air, ammonium, fosfat dan sulfat yang boleh digunakan tumbuhan. Yang tinggal kebanyakannya lignin separa reput dan sel mikrob.</p>"});
 const an=T({
  zh:"<p><b>积水缺氧：</b>氧化被阻断，上面那些简单养分形不成，CO₂ 也少得多。残体里的纤维素、木质素和蛋白质大多原样留着。</p><p>对果园的意思：积水的土，有机质堆着却放不出养分。先解决排水，再谈加有机质。</p>",
  en:"<p><b>Waterlogged, no air:</b> oxidation stops, those simple nutrients do not form, and far less CO₂ is released. Much of the cellulose, lignin and protein stays as it was.</p><p>For an orchard: in waterlogged soil, organic matter sits there without releasing nutrients. Fix drainage before adding more.</p>",
  bm:"<p><b>Bertakung, tiada udara:</b> pengoksidaan terhenti, nutrien ringkas itu tidak terbentuk, dan CO₂ jauh lebih sedikit. Banyak selulosa, lignin dan protein kekal seperti asal.</p><p>Untuk dusun: dalam tanah bertakung, bahan organik tersimpan tanpa membebaskan nutrien. Baiki saliran dahulu sebelum menambah lagi.</p>"});
 $("v-basics").innerHTML=
 '<h2>'+T({zh:"土壤有机质是什么",en:"What soil organic matter is",bm:"Apa itu bahan organik tanah"})+'</h2>'
 +'<p class="lead">'+T({zh:"土壤里所有来自动植物和微生物的有机物，活的不算。它不断有新的进来，也不断被分解掉。",en:"Everything in the soil that came from plants, animals and microbes, not counting what is still alive. New material keeps arriving and old material keeps being broken down.",bm:"Semua bahan dalam tanah yang berasal daripada tumbuhan, haiwan dan mikrob, tidak termasuk yang masih hidup. Bahan baharu sentiasa masuk dan bahan lama sentiasa terurai."})+'</p>'
 +'<div class="card"><div class="chips">'
 +chip("view","today",T({zh:"今天的看法",en:"Today's view",bm:"Pandangan hari ini"}),view==="today")
 +chip("view","lecture",T({zh:"课堂笔记的看法",en:"Lecture-notes view",bm:"Pandangan nota kuliah"}),view==="lecture")
 +'</div>'+(view==="today"?flowToday+todayTxt+src(["LK","LI","LA","OL"]):flowLecture+lecTxt+src(["L1"]))+'</div>'
 +'<div class="card"><h3>'+T({zh:"分解需要空气",en:"Breakdown needs air",bm:"Pereputan perlukan udara"})+'</h3><div class="chips">'
 +chip("air","ae",T({zh:"通气的土",en:"Aerated soil",bm:"Tanah berudara"}),air==="ae")
 +chip("air","an",T({zh:"积水的土",en:"Waterlogged soil",bm:"Tanah bertakung"}),air==="an")
 +'</div><div class="box">'+(air==="ae"?IC.gas:IC.water)+'<div>'+(air==="ae"?ae:an)+'</div></div>'+src(["L1"])+'</div>'
 +'<div class="card"><h3>'+T({zh:"为什么在马来西亚特别重要",en:"Why it matters more in Malaysia",bm:"Mengapa ia lebih penting di Malaysia"})+'</h3>'
 +T({
  zh:"<p>马来西亚约 72% 的土地是高度风化的老成土和氧化土，粘粒以高岭石为主，本身抓不住多少养分。测过的几个土系，阳离子交换量只有 7.5 到 12 cmolc/kg。</p><p>课堂笔记给出的有机质交换量是每 100 克 100 到 150 毫当量，大约高出十倍。在这种土里，肥料留不留得住，很大程度上靠有机质。</p>",
  en:"<p>About 72% of Malaysia is highly weathered Ultisols and Oxisols. Their clay is mostly kaolinite, which holds few nutrients on its own. Measured soil series had a cation exchange capacity of only 7.5 to 12 cmolc/kg.</p><p>The lecture notes put the exchange capacity of organic matter at 100 to 150 meq per 100 g, roughly ten times higher. In these soils, whether fertiliser stays or washes away depends heavily on organic matter.</p>",
  bm:"<p>Kira-kira 72% Malaysia ialah tanah Ultisol dan Oksisol yang terluluhawa lanjut. Liatnya kebanyakannya kaolinit, yang sendiri kurang memegang nutrien. Siri tanah yang diukur mempunyai kapasiti pertukaran kation hanya 7.5 hingga 12 cmolc/kg.</p><p>Nota kuliah meletakkan kapasiti pertukaran bahan organik pada 100 hingga 150 meq setiap 100 g, kira-kira sepuluh kali ganda. Dalam tanah begini, sama ada baja kekal atau larut lesap banyak bergantung pada bahan organik.</p>"})
 +src(["SH","L1"])+'</div>'
 +'<div class="card"><h3>'+T({zh:"有机肥和化肥一起用",en:"Organic and mineral fertiliser together",bm:"Baja organik dan baja kimia bersama"})+'</h3>'
 +T({
  zh:"<p>课堂笔记的结论：单用有机质，改善的是土壤物理和生物性状；单用化肥，增加的是速效养分；两者合用，土壤既有养分，又留得住、放得出。</p>",
  en:"<p>The lecture notes conclude: organic matter alone improves the soil's physical and biological condition; mineral fertiliser alone adds available nutrients; the two together give a soil that has nutrients, holds them and releases them.</p>",
  bm:"<p>Kesimpulan nota kuliah: bahan organik sahaja memperbaiki keadaan fizikal dan biologi tanah; baja kimia sahaja menambah nutrien tersedia; kedua-duanya bersama memberi tanah yang ada nutrien, memegangnya dan membebaskannya.</p>"})
 +src(["L1"])+'</div>';
}

/* ================= EFFECTS ================= */

 {id:"phys",n:{zh:"土壤物理",en:"Soil physics",bm:"Fizik tanah"}},

 {id:"plant",n:{zh:"植物生理",en:"Plant physiology",bm:"Fisiologi tumbuhan"}},
 {id:"prod",n:{zh:"产量品质",en:"Yield and quality",bm:"Hasil dan kualiti"}}
];
const FX=[
 {g:"phys",e:"strong",r:["L1","US","VS"],t:{zh:"团粒结构更稳",en:"Stable soil crumbs",bm:"Gumpalan tanah lebih stabil"},
  b:{zh:"微生物分泌的胶和有机质把土粒粘成团粒。团粒稳，土才有孔隙，根才扎得进去。有机质一少，土块泡水就散。这一点可以自己验证，见“检查”页的泡水测试。",
     en:"Microbial gums and organic matter glue soil particles into crumbs. Stable crumbs give the soil pores, and roots can push through. When organic matter drops, clods fall apart in water. You can test this yourself with the water test on the Check tab.",
     bm:"Gam mikrob dan bahan organik melekatkan zarah tanah menjadi gumpalan. Gumpalan yang stabil memberi liang, dan akar mudah menembusi. Apabila bahan organik berkurang, ketulan hancur dalam air. Anda boleh uji sendiri dengan ujian air dalam tab Semak."}},
 {g:"phys",e:"mixed",r:["MM","L1"],t:{zh:"保水",en:"Holding water",bm:"Memegang air"},
  b:{zh:"课堂笔记说有机质能提高保水力、帮助抗旱。大型数据分析显示这个作用比想象的小：土壤有机碳每增加 1%，每 100 毫米土层的有效水平均只多 1.16 毫米；砂土增幅最大，粘土最小。真正管用的是另外两点：有机质造出的大孔隙让雨水渗得进去，地面覆盖物减少蒸发。",
     en:"The lecture notes say organic matter raises water-holding capacity and helps against drought. A large data analysis found the effect smaller than expected: each 1% rise in soil organic carbon adds on average only 1.16 mm of plant-available water per 100 mm of soil, most in sands and least in clays. Two other things help more: the large pores organic matter creates let rain soak in, and a surface mulch cuts evaporation.",
     bm:"Nota kuliah menyatakan bahan organik meningkatkan pegangan air dan membantu melawan kemarau. Analisis data besar mendapati kesannya lebih kecil daripada jangkaan: setiap kenaikan 1% karbon organik tanah hanya menambah purata 1.16 mm air tersedia bagi setiap 100 mm tanah, paling banyak di tanah berpasir dan paling sedikit di tanah liat. Dua perkara lain lebih membantu: liang besar yang dibentuk bahan organik membolehkan hujan meresap, dan sungkupan di permukaan mengurangkan sejatan."}},
 {g:"phys",e:"strong",r:["US","VS","L2"],t:{zh:"少结皮、少冲刷",en:"Less crusting and erosion",bm:"Kurang kerak dan hakisan"},
  b:{zh:"团粒不稳的土，雨点一打就散，表面结皮，水渗不下去就顺坡流走，把表土带走。有机质和地面覆盖是防线。",
     en:"Soil with weak crumbs breaks up under raindrops and seals into a crust. Water then runs off downslope and takes topsoil with it. Organic matter and ground cover are the defence.",
     bm:"Tanah dengan gumpalan lemah pecah apabila ditimpa hujan dan membentuk kerak. Air kemudian mengalir di permukaan dan membawa tanah atas. Bahan organik dan litupan tanah ialah benteng."}},
 {g:"chem",e:"strong",r:["L1","SH"],t:{zh:"抓住养分，减少淋失",en:"Holding nutrients against leaching",bm:"Memegang nutrien, kurangkan larut lesap"},
  b:{zh:"有机质带负电，能吸住钾、钙、镁、铵这些阳离子，再慢慢放给根。在高岭石为主的本地土壤里，这是最实在的好处。",
     en:"Organic matter carries negative charge. It holds potassium, calcium, magnesium and ammonium, then releases them slowly to roots. In local kaolinite soils this is the most solid benefit.",
     bm:"Bahan organik bercas negatif. Ia memegang kalium, kalsium, magnesium dan ammonium, kemudian membebaskannya perlahan-lahan kepada akar. Di tanah kaolinit tempatan, inilah manfaat paling nyata."}},
 {g:"chem",e:"strong",r:["L3","OL"],t:{zh:"螯合铁锌锰铜",en:"Chelating iron, zinc, manganese, copper",bm:"Mengkelat besi, zink, mangan, kuprum"},
  b:{zh:"腐植物质把微量元素包住，让它们留在溶液里。腐植物质促进植物吸铁，在水培和田间都得到证实，所以能减轻缺铁黄化。但要注意反面：Visser 记录过腐植质把铜抓得太紧，造成谷类缺铜的“开垦病”。",
     en:"Humic substances wrap trace metals and keep them in solution. Better iron uptake with humic substances has been shown in solution culture and in the field, which is why they can ease iron chlorosis. There is a flip side: Visser records “reclamation disease”, where humic matter held copper so tightly that cereals became copper deficient.",
     bm:"Bahan humik membalut logam surih dan mengekalkannya dalam larutan. Pengambilan besi yang lebih baik dengan bahan humik telah ditunjukkan dalam kultur larutan dan di ladang, sebab itu ia boleh meredakan klorosis besi. Ada sisi sebaliknya: Visser merekodkan “penyakit tebus guna”, apabila bahan humik memegang kuprum terlalu kuat sehingga bijirin kekurangan kuprum."}},
 {g:"chem",e:"weak",r:["L1","L2"],t:{zh:"缓冲酸碱",en:"Buffering pH",bm:"Menampan pH"},
  b:{zh:"课堂笔记说有机质是缓冲剂，长期用化肥引起的酸碱变化会被它减缓；但也说明有机质本身不改变土壤酸碱度。所以它不能代替调酸。这一条我只在课堂笔记和产品图表里见到。",
     en:"The lecture notes call organic matter a buffer that slows the pH drift caused by long-term mineral fertiliser. They also say organic matter itself does not change soil reaction, so it does not replace pH correction. I found this point only in the lecture notes and the product chart.",
     bm:"Nota kuliah menyebut bahan organik sebagai penampan yang memperlahankan perubahan pH akibat baja kimia jangka panjang. Nota juga menyatakan bahan organik sendiri tidak mengubah tindak balas tanah, jadi ia tidak menggantikan pembetulan pH. Saya hanya menemui perkara ini dalam nota kuliah dan carta produk."}},
 {g:"chem",e:"mixed",r:["L1","L2","HB"],t:{zh:"让磷更有效",en:"Making phosphorus more available",bm:"Menjadikan fosforus lebih tersedia"},
  b:{zh:"课堂笔记说有机质能减少磷被固定。但加州大学用五种商品腐植酸在四种缺磷土壤上试验，施磷肥增加了吸磷量，加腐植酸没有。大量的有机质和几公斤的腐植酸产品不是一回事。",
     en:"The lecture notes say organic matter reduces phosphorus fixation. Yet a University of California trial with five commercial humic acids on four low-phosphorus soils found that phosphorus fertiliser raised uptake and humic acid did not. Tonnes of organic matter and a few kilograms of humic product are different things.",
     bm:"Nota kuliah menyatakan bahan organik mengurangkan pengikatan fosforus. Namun ujian Universiti California dengan lima asid humik komersial pada empat tanah rendah fosforus mendapati baja fosforus meningkatkan pengambilan, manakala asid humik tidak. Bertan-tan bahan organik dan beberapa kilogram produk humik ialah dua perkara berbeza."}},
 {g:"chem",e:"strong",r:["OL","L1"],t:{zh:"吸附农药和重金属",en:"Binding pesticides and heavy metals",bm:"Mengikat racun perosak dan logam berat"},
  b:{zh:"田间研究发现农药优先结合在腐植酸上，移动性降低。金属离子在土壤和水里的行为，也要靠腐植酸和黄腐酸的结合位点才能算准。",
     en:"Field studies found pesticides bind preferentially to humic acid, which reduces their movement. Predicting how metal ions behave in soil and water also depends on the binding sites of humic and fulvic acids.",
     bm:"Kajian lapangan mendapati racun perosak lebih cenderung terikat pada asid humik, lalu kurang bergerak. Meramal kelakuan ion logam dalam tanah dan air juga bergantung pada tapak ikatan asid humik dan fulvik."}},
 {g:"bio",e:"strong",r:["L1","LI","LK"],t:{zh:"土壤生物的食物",en:"Food for soil life",bm:"Makanan hidupan tanah"},
  b:{zh:"课堂笔记称有机质是土壤里几乎一切生命活动的中心。今天的研究更进一步：微生物把残体变成自己的身体，死后的残体又成为稳定有机质的主体，可占一半以上。",
     en:"The lecture notes call organic matter the centre of nearly all life in the soil. Current research goes further: microbes turn residues into their own bodies, and their remains become the bulk of lasting organic matter, sometimes more than half.",
     bm:"Nota kuliah menyebut bahan organik sebagai pusat hampir semua kehidupan dalam tanah. Kajian semasa pergi lebih jauh: mikrob menukar sisa menjadi badan mereka sendiri, dan sisa mereka menjadi sebahagian besar bahan organik yang kekal, kadangkala lebih separuh."}},
 {g:"plant",e:"strong",r:["C02","C15","RO","L3"],t:{zh:"根长得更多",en:"More root growth",bm:"Akar tumbuh lebih banyak"},
  b:{zh:"这是腐植物质最经得起检验的直接作用。实验显示腐植酸激活根细胞膜上的质子泵（H⁺-ATP 酶），促使侧根萌发。81 篇论文的荟萃分析估计根干重平均增加 21%（±6%）。Visser 也指出对根的作用大于地上部，幼苗期最明显。",
     en:"This is the best-tested direct effect of humic substances. Experiments show humic acids switch on the proton pump (H⁺-ATPase) in root cell membranes and trigger lateral roots. A meta-analysis of 81 papers estimated root dry weight rises by 21% (±6%) on average. Visser also notes a larger effect on roots than on tops, strongest in seedlings.",
     bm:"Inilah kesan langsung bahan humik yang paling teruji. Eksperimen menunjukkan asid humik menghidupkan pam proton (H⁺-ATPase) pada membran sel akar dan mencetuskan akar sisi. Meta-analisis 81 kertas menganggarkan berat kering akar naik purata 21% (±6%). Visser juga mencatat kesan lebih besar pada akar berbanding pucuk, paling kuat pada anak benih."}},
 {g:"plant",e:"mixed",r:["RO","HB","LG"],t:{zh:"地上部长得更好",en:"Better shoot growth",bm:"Pucuk tumbuh lebih baik"},
  b:{zh:"同一荟萃分析估计地上部干重平均增加 22%（±4%），逆境下更高（28%，正常条件 18%）。但这些多是温室和水培试验。田间按商品推荐量使用，结果很不一致；加州大学的番茄和生菜试验没有看到增产。",
     en:"The same meta-analysis estimated shoot dry weight rises by 22% (±4%) on average, more under stress (28% against 18% without stress). Most of those trials were in greenhouses and solution culture. In the field at commercial label rates results are inconsistent, and the University of California tomato and lettuce trials saw no yield gain.",
     bm:"Meta-analisis yang sama menganggarkan berat kering pucuk naik purata 22% (±4%), lebih tinggi dalam keadaan tekanan (28% berbanding 18% tanpa tekanan). Kebanyakan ujian itu dijalankan di rumah hijau dan kultur larutan. Di ladang pada kadar label komersial, keputusan tidak konsisten, dan ujian tomato serta salad Universiti California tidak melihat peningkatan hasil."}},
 {g:"plant",e:"mixed",r:["L3","NA","C15"],t:{zh:"类激素作用",en:"Hormone-like action",bm:"Tindakan seperti hormon"},
  b:{zh:"Visser 当年持保留态度：腐植酸的活性远低于真正的生长素，而且不像生长素那样抑制根。近年的研究认为腐植物质通过类似激素的信号通路起作用，小分子能进入根细胞，大分子则作用在细胞外的受体上。机理还没有完全定论。",
     en:"Visser was cautious: humic activity is far weaker than true auxin, and unlike auxin it does not inhibit roots. Recent work holds that humic substances act through hormone-like signalling, with small molecules entering root cells and large ones acting on receptors outside the cell. The mechanism is not fully settled.",
     bm:"Visser berhati-hati: aktiviti humik jauh lebih lemah daripada auksin sebenar, dan tidak merencat akar seperti auksin. Kajian terkini berpendapat bahan humik bertindak melalui isyarat seperti hormon, dengan molekul kecil memasuki sel akar dan molekul besar bertindak pada reseptor di luar sel. Mekanismenya belum muktamad."}},
 {g:"plant",e:"mixed",r:["L3","HB"],t:{zh:"种子发芽更快",en:"Faster germination",bm:"Percambahan lebih cepat"},
  b:{zh:"Visser 引述的早期试验：腐植酸和黄腐酸加快发芽速度，但不增加发芽粒数。加州大学用 250 到 750 ppm 腐植酸溶液浸泡生菜种子，发芽速度和发芽率与清水相同。",
     en:"Early trials cited by Visser: humic and fulvic acids speed up germination but do not raise the number of seeds that germinate. The University of California soaked lettuce seed in 250 to 750 ppm humic acid and saw the same speed and rate as water.",
     bm:"Ujian awal yang dipetik Visser: asid humik dan fulvik mempercepat percambahan tetapi tidak menambah bilangan biji yang bercambah. Universiti California merendam biji salad dalam asid humik 250 hingga 750 ppm dan melihat kelajuan serta kadar yang sama seperti air."}},
 {g:"plant",e:"strong",r:["L3","AN"],t:{zh:"用多了反而有害",en:"Too much does harm",bm:"Terlalu banyak memudaratkan"},
  b:{zh:"Visser 提醒：腐植酸越多呼吸越强，光合却跟不上，代谢会失衡；浓度很高时细胞膜受损。2010 年的试验中，每升 1 克的腐植酸堵住玉米根细胞壁的孔，根的导水能力最多降了 44%，地上部生长和抗旱力都下降。详见“腐植酸”页的浓度对照。",
     en:"Visser warns that respiration keeps rising with more humic acid while photosynthesis does not, so metabolism goes out of balance, and at very high concentration cell membranes are damaged. In a 2010 trial, humic acid at 1 g per litre clogged pores in maize root cell walls, cut root water conductivity by up to 44%, and reduced shoot growth and drought resistance. See the concentration comparison on the Humic tab.",
     bm:"Visser memberi amaran bahawa respirasi terus meningkat dengan lebih banyak asid humik sedangkan fotosintesis tidak, jadi metabolisme tidak seimbang, dan pada kepekatan sangat tinggi membran sel rosak. Dalam ujian 2010, asid humik pada 1 g seliter menyumbat liang dinding sel akar jagung, mengurangkan kekonduksian air akar sehingga 44%, serta mengurangkan pertumbuhan pucuk dan ketahanan kemarau. Lihat perbandingan kepekatan dalam tab Humik."}},
 {g:"prod",e:"mixed",r:["OF"],t:{zh:"有机质高，产量高，但有上限",en:"More organic matter, more yield, up to a point",bm:"Lebih bahan organik, lebih hasil, hingga satu tahap"},
  b:{zh:"全球玉米和小麦数据显示，土壤有机碳越高产量越高，增幅最大的是 0.1% 到 2% 这一段，到 2% 左右就趋平。这是粮食作物的结果，榴莲没有同类数据。它的启示是：最贫瘠的土，补有机质最划算。",
     en:"Global maize and wheat data show yields rise with soil organic carbon. The biggest gains come between 0.1% and 2%, and they level off at about 2%. These are grain crops, and there is no equivalent data for durian. The lesson is that the poorest soils gain the most from added organic matter.",
     bm:"Data jagung dan gandum global menunjukkan hasil meningkat dengan karbon organik tanah. Peningkatan terbesar antara 0.1% dan 2%, dan mendatar pada kira-kira 2%. Ini tanaman bijirin, dan tiada data setara untuk durian. Pengajarannya: tanah paling miskin paling beruntung daripada tambahan bahan organik."}},
 {g:"prod",e:"weak",r:["DU"],t:{zh:"榴莲上的试验",en:"Trials on durian",bm:"Ujian pada durian"},
  b:{zh:"我只找到一项：印尼茂物农业大学 2024 年在猫山王和 Bawor 幼树上，比较了添加沸石和腐植酸的 6:6:12 颗粒肥与普通 15:15:15。两者的株高、茎粗和分枝数没有显著差别。换个角度看，养分含量低得多的肥料长得一样好；但它没有证明腐植酸让榴莲长得更快，也没有结果期的数据。",
     en:"I found only one: in 2024 IPB University in Indonesia compared a 6:6:12 granular fertiliser with added zeolite and humic acid against ordinary 15:15:15 on young Musang King and Bawor trees. Height, stem diameter and branch number did not differ significantly. Seen one way, a fertiliser with far less nutrient did as well. It does not show humic acid makes durian grow faster, and it has no data from bearing trees.",
     bm:"Saya hanya menemui satu: pada 2024 Universiti IPB di Indonesia membandingkan baja butir 6:6:12 yang ditambah zeolit dan asid humik dengan 15:15:15 biasa pada pokok muda Musang King dan Bawor. Tinggi, diameter batang dan bilangan dahan tidak berbeza dengan ketara. Dari satu sudut, baja dengan nutrien jauh lebih rendah memberi hasil sama. Ia tidak menunjukkan asid humik mempercepat pertumbuhan durian, dan tiada data pokok berbuah."}},
 {g:"prod",e:"weak",r:["L2","C15"],t:{zh:"糖分、风味、耐储",en:"Sugar, flavour, keeping quality",bm:"Gula, rasa, ketahanan simpan"},
  b:{zh:"Daymsa 的 Naturvital 图表列出了提高糖分和维生素、改善风味、提早成熟等效果。园艺作物的综述确实汇总过一些品质方面的正面结果，但各试验的产品、用量和作物都不同，很难推到榴莲上。把它当作值得自己小规模验证的说法。",
     en:"The Daymsa chart for Naturvital lists more sugar and vitamins, better flavour and earlier ripening. A review of horticultural crops does collect some positive quality results, but the products, rates and crops differ from trial to trial, so they are hard to carry over to durian. Treat these as claims worth checking yourself on a small scale.",
     bm:"Carta Daymsa untuk Naturvital menyenaraikan lebih gula dan vitamin, rasa lebih baik dan masak lebih awal. Satu ulasan tanaman hortikultur memang mengumpul beberapa keputusan kualiti yang positif, tetapi produk, kadar dan tanaman berbeza antara ujian, jadi sukar dipindahkan kepada durian. Anggap ini dakwaan yang wajar anda uji sendiri secara kecil-kecilan."}}

  strong:{zh:"保持现在的做法：落叶和草屑留在树冠下，每年补一次腐熟堆肥。半年后再检查一次。",en:"Keep doing what you do: leave litter and cut grass under the canopy and top up with mature compost once a year. Check again in six months.",bm:"Teruskan amalan sekarang: biarkan daun gugur dan rumput potong di bawah kanopi dan tambah kompos matang setahun sekali. Semak semula dalam enam bulan."},
  mixed:{zh:"这个月开始：树冠下铺满覆盖物（落叶、草屑、碎枝），离树干留出空隙。雨季初施腐熟堆肥。半年后再检查。",en:"Starting this month: cover the ground under the canopy with mulch (leaf litter, cut grass, chipped prunings), leaving a gap around the trunk. Apply mature compost at the start of the rains. Check again in six months.",bm:"Bermula bulan ini: liputi tanah di bawah kanopi dengan sungkupan (daun gugur, rumput potong, ranting cincang), tinggalkan ruang di sekeliling batang. Tabur kompos matang pada awal musim hujan. Semak semula dalam enam bulan."},
  weak:{zh:"这个月开始：树冠下铺满覆盖物（落叶、草屑、碎枝），离树干留出空隙；停止把地面清得光秃秃。雨季初施腐熟堆肥，之后每季补覆盖物。三个月后再检查。",en:"Starting this month: cover the ground under the canopy with mulch (leaf litter, cut grass, chipped prunings), leaving a gap around the trunk, and stop clearing the ground bare. Apply mature compost at the start of the rains, then top up the mulch every season. Check again in three months.",bm:"Bermula bulan ini: liputi tanah di bawah kanopi dengan sungkupan (daun gugur, rumput potong, ranting cincang), tinggalkan ruang di sekeliling batang, dan berhenti membersihkan tanah sehingga gondol. Tabur kompos matang pada awal musim hujan, kemudian tambah sungkupan setiap musim. Semak semula dalam tiga bulan."}}[lv];
 const weakest=QS.filter(q=>Number(ans[q.id])===0);
 return '<div class="result r-'+lv+'">'+badge(lv).replace(esc(T(S.ev[lv])),sc+' / 12')+'<h3>'+esc(T(head))+'</h3><div class="meter"><span style="width:'+(sc/12*100)+'%"></span></div><p>'+esc(T(base))+'</p>'
  +(weakest.length?'<ul>'+weakest.map(q=>'<li>'+esc(T(q.tip))+'</li>').join("")+'</ul>':'')
  +'<p>'+T({zh:"这是按看得见的迹象做的简易判断，不是化验值。",en:"This is a simple judgement from visible signs. It is not a laboratory value.",bm:"Ini penilaian ringkas daripada tanda yang nampak. Ia bukan nilai makmal."})+'</p>'+src(["VS","US"])+'</div>';
}
function calcResult(){
 const a=parseFloat(String(area).replace(",","."));
 if(!(a>0))return '<div class="result"><p>'+T({zh:"填入面积，这里显示结果。",en:"Enter the area to see the result here.",bm:"Masukkan keluasan untuk melihat keputusan di sini."})+'</p></div>';
 const dm=Number(depth)/100, m2=a*4046.86, soil=m2*dm*1.3, om=soil*0.01;
 const mm=1.16*(1/1.724)*(Number(depth)/10), litres=mm*m2;
 return '<div class="result"><div class="kv">'
  +'<span>'+T({zh:"这层土的重量",en:"Weight of this soil layer",bm:"Berat lapisan tanah ini"})+'</span><b>'+fmt(soil,0)+' t</b>'
  +'<span>'+T({zh:"其中 1% 有机质",en:"1% of it as organic matter",bm:"1% daripadanya sebagai bahan organik"})+'</span><b>'+fmt(om,1)+' t</b>'
  +'<span>'+T({zh:"多存的有效水",en:"Extra plant-available water",bm:"Air tersedia tambahan"})+'</span><b>'+fmt(mm,1)+' mm</b>'
  +'<span>'+T({zh:"折合水量",en:"As a volume of water",bm:"Sebagai isi padu air"})+'</span><b>'+fmt(litres,0)+' L</b>'
  +'</div><p>'+T({zh:"要把有机质提高 1 个百分点，留在土里的有机质就要有这么多吨，而施下去的有机物大部分会被微生物呼吸掉。所以要年年补、不间断：管的是流量，不是一次存够。多存的水只有一毫米上下；覆盖物减少蒸发、帮助雨水下渗，才是抗旱的主力。",en:"Raising organic matter by one percentage point means this many tonnes must stay in the soil, and microbes respire away most of what you apply. So add it every year without a break: you are managing a flow, not filling a tank once. The extra stored water is only about a millimetre. Mulch that cuts evaporation and lets rain soak in does most of the work against drought.",bm:"Menaikkan bahan organik sebanyak satu mata peratus bermakna sebanyak ini tan mesti kekal dalam tanah, dan mikrob menghembus keluar sebahagian besar yang anda tabur. Jadi tambah setiap tahun tanpa henti: anda mengurus aliran, bukan mengisi tangki sekali. Air tambahan yang disimpan hanya kira-kira satu milimeter. Sungkupan yang mengurangkan sejatan dan membolehkan hujan meresap itulah yang paling banyak membantu melawan kemarau."})+'</p>'
  +'<p>'+T({zh:"计算假设：土壤容重 1.3 吨/立方米；有机质 = 有机碳 × 1.724；有机碳每增 1%，每 100 毫米土层有效水增 1.16 毫米。",en:"Assumptions: soil bulk density 1.3 t per cubic metre; organic matter = organic carbon × 1.724; each 1% of organic carbon adds 1.16 mm of available water per 100 mm of soil.",bm:"Andaian: ketumpatan pukal tanah 1.3 t setiap meter padu; bahan organik = karbon organik × 1.724; setiap 1% karbon organik menambah 1.16 mm air tersedia bagi setiap 100 mm tanah."})+'</p>'+src(["MM","LK"])+'</div>';
}
function check(){
 $("v-check").innerHTML=
 '<h2>'+T({zh:"不用化验，检查土壤有机质",en:"Check soil organic matter without a lab",bm:"Semak bahan organik tanah tanpa makmal"})+'</h2>'
 +'<p class="lead">'+T({zh:"一把铲、一杯清水就够。在树冠下选一处有代表性的地方。",en:"A spade and a glass of clear water are enough. Pick a typical spot under the canopy.",bm:"Sebatang penyodok dan segelas air jernih sudah cukup. Pilih satu tempat biasa di bawah kanopi."})+'</p>'
 +'<div class="card">'+QS.map(q=>'<div class="q"><div class="hd">'+QI[q.id]+'<span class="lab">'+esc(T(q.q))+'</span></div>'+(T(q.h)?'<p>'+esc(T(q.h))+'</p>':'')+'<div class="chips">'+q.o.map((o,i)=>chip("ans."+q.id,i,T(o),String(ans[q.id])===String(i))).join("")+'</div></div>').join("")+'</div>'
 +'<div id="chk-out">'+checkResult()+'</div>'
 +'<h2>'+T({zh:"1% 有机质有多重",en:"What 1% organic matter weighs",bm:"Berapa berat 1% bahan organik"})+'</h2>'
 +'<div class="card"><div class="q"><label class="lab" for="area">'+T({zh:"面积（英亩）",en:"Area (acres)",bm:"Keluasan (ekar)"})+'</label><input id="area" type="text" inputmode="decimal" autocomplete="off" value="'+esc(area)+'"></div>'
 +'<div class="q"><span class="lab">'+T({zh:"土层深度",en:"Soil depth",bm:"Kedalaman tanah"})+'</span><div class="chips">'+chip("depth","15","15 cm",depth==="15")+chip("depth","30","30 cm",depth==="30")+'</div></div></div>'
 +'<div id="calc-out">'+calcResult()+'</div>';
}

/* ================= SOURCES ================= */
function sources(){
 $("v-sources").innerHTML=
 '<h2>'+T({zh:"资料来源",en:"Sources",bm:"Rujukan"})+'</h2>'
 +'<p class="lead">'+T({zh:"前三项是借来的课堂笔记，其余是用来核对和补充的研究与机构指南。",en:"The first three are the borrowed lecture notes. The rest are the studies and institutional guides used to check and extend them.",bm:"Tiga yang pertama ialah nota kuliah yang dipinjam. Selebihnya ialah kajian dan panduan institusi yang digunakan untuk menyemak dan melanjutkannya."})+'</p>'
 +'<div class="card"><ol class="refs">'+REFORDER.map(k=>{const r=REF[k];return '<li>'+(r.s?esc(T(r.s)):esc(r.c)+' <a href="'+r.u+'" target="_blank" rel="noopener">'+T({zh:"打开",en:"Open",bm:"Buka"})+'</a>')+'</li>'}).join("")+'</ol></div>'
 +'<div class="card qr"><h3>'+T({zh:"分享这个软件",en:"Share this app",bm:"Kongsi aplikasi ini"})+'</h3>'+QR+'<span class="url">'+URL_APP+'</span><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(T({zh:"沃土有机质 HumusLab：土壤有机质与腐植酸 ",en:"HumusLab: soil organic matter and humic substances ",bm:"HumusLab: bahan organik tanah dan asid humik "})+URL_APP)+'">WhatsApp</a></div>'
 +'<details><summary><span class="row"><span>'+T({zh:"三档证据是怎么分的",en:"How the three evidence grades were set",bm:"Bagaimana tiga gred bukti ditetapkan"})+'</span></span></summary><div class="in"><p>'
 +T({zh:"证据充分：有荟萃分析、机构指南或多项独立研究支持，或机理已在实验中直接观察到。视情况而定：实验室里成立，但田间结果不一致，或作用大小因土质、作物、用量而变。证据有限：只见于课堂笔记或产品资料，或只有个别试验。榴莲上的直接研究很少，凡是从其他作物推过来的地方都已注明。",
     en:"Well supported: backed by a meta-analysis, an institutional guide or several independent studies, or the mechanism was observed directly in experiments. Depends on conditions: holds in the laboratory but field results are inconsistent, or the size of the effect changes with soil, crop and rate. Limited evidence: found only in the lecture notes or product material, or in a single trial. Direct research on durian is scarce, and every place where results come from other crops says so.",
     bm:"Bukti kukuh: disokong oleh meta-analisis, panduan institusi atau beberapa kajian bebas, atau mekanismenya diperhatikan terus dalam eksperimen. Bergantung keadaan: benar di makmal tetapi keputusan ladang tidak konsisten, atau saiz kesan berubah mengikut tanah, tanaman dan kadar. Bukti terhad: hanya ditemui dalam nota kuliah atau bahan produk, atau dalam satu ujian sahaja. Kajian langsung tentang durian amat sedikit, dan setiap tempat yang keputusannya datang daripada tanaman lain telah dinyatakan."})
 +'</p></div></details>';
}

/* ================= shell ================= */
const VIEWS={basics,effects,humic,check,sources};
let tab="basics";
function route(){const h=location.hash.replace("#","");tab=VIEWS[h]?h:"basics";paint()}
function paint(){
 document.documentElement.lang=lang==="bm"?"ms":lang;
 $("ttl").textContent=T(S.title);
 $("lg").textContent=LABEL[lang];
 $("toastmsg").textContent=T({zh:"新版本已准备好",en:"A new version is ready",bm:"Versi baharu sudah sedia"});
 $("toastgo").textContent=T({zh:"刷新",en:"Refresh",bm:"Muat semula"});
 $("nav").innerHTML=S.tabs.map(t=>'<button type="button" data-tab="'+t.id+'"'+(t.id===tab?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t.i+'</svg><span>'+esc(T(t.n))+'</span></button>').join("");
 for(const k in VIEWS){$("v-"+k).classList.toggle("on",k===tab)}
 VIEWS[tab]();
}
document.addEventListener("click",ev=>{
 const nb=ev.target.closest("nav button");
 if(nb){tab=nb.dataset.tab;try{location.hash=tab}catch(e){}paint();window.scrollTo(0,0);return}
 const b=ev.target.closest("[data-g]");
 if(!b)return;
 const g=b.dataset.g,v=b.dataset.v;
 if(g==="view"){view=v;store.set("view",v)}
 else if(g==="air"){air=v;store.set("air",v)}
 else if(g==="fg"){fg=v}
 else if(g==="fr"){fr=v}
 else if(g==="dose"){dose=v}
 else if(g==="depth"){depth=v;store.set("depth",v)}
 else if(g.startsWith("dq.")){const k=g.slice(3);dq[k]=v;store.set(g,v)}
 else if(g.startsWith("ans.")){ans[g.slice(4)]=Number(v);store.set("ans",JSON.stringify(ans))}
 const y=window.scrollY;VIEWS[tab]();window.scrollTo(0,y);
});
document.addEventListener("input",ev=>{
 if(ev.target.id==="area"){area=ev.target.value;store.set("area",area);$("calc-out").innerHTML=calcResult()}
});
$("lg").addEventListener("click",()=>{lang=ORDER[(ORDER.indexOf(lang)+1)%3];store.set("lang",lang);paint()});
let size=Number(store.get("size"))||0;
const applySize=()=>{document.documentElement.dataset.size=String(size)};
$("aa").addEventListener("click",()=>{size=(size+1)%3;store.set("size",String(size));applySize()});
applySize();
$("pick").addEventListener("click",ev=>{const b=ev.target.closest("button[data-l]");if(!b)return;lang=b.dataset.l;store.set("lang",lang);$("pick").classList.remove("on");paint()});
window.addEventListener("hashchange",route);
$("toastgo").addEventListener("click",()=>location.reload());
$("toastx").addEventListener("click",()=>{$("toast").hidden=true});
try{
 if("serviceWorker" in navigator && (/github\.io$/.test(location.hostname)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  const ask=()=>{if(navigator.onLine===false)return;navigator.serviceWorker.ready.then(r=>{if(r.active)r.active.postMessage("check")}).catch(()=>{})};
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data==="updated")$("toast").hidden=false});
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").then(ask).catch(()=>{})});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")ask()});
 }
}catch(e){}
if(!ORDER.includes(lang)){lang="zh";$("pick").classList.add("on")}
route();
</script>
</body>
</html>
